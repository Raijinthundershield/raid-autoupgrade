name: Release

# Build the one-file Windows exe and publish it to a GitHub Release on every
# v* tag push. See docs/adr/0003-onefile-unsigned-release.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the Release and upload the asset

jobs:
  build:
    runs-on: windows-latest # native deps: WMI, Win32, OpenCV, pywebview/Edge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync

      - name: Verify tag matches pyproject version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $proj = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          Write-Host "tag=$tag pyproject=$proj"
          if ($tag -ne $proj) {
            Write-Error "Tag version '$tag' does not match pyproject.toml version '$proj'."
            exit 1
          }

      - name: Build exe
        run: uv run pyinstaller raid-autoupgrade.spec

      - name: Rename artifact
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          Move-Item dist/RaidAutoupgrade.exe "dist/RaidAutoupgrade-v$ver-win64.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RaidAutoupgrade-v*-win64.exe
          body_path: .github/release-notes.md
          generate_release_notes: true
